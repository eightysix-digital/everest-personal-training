<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" role="img" aria-label="A movement screen: a figure with a plumb line, level lines at the shoulders and hips, and joint measurement points marked">
<defs>
<linearGradient id="s2" x1="0" y1="0" x2="0.6" y2="1">
<stop offset="0" stop-color="#0A1416"/><stop offset="0.5" stop-color="#06333A"/><stop offset="1" stop-color="#111111"/>
</linearGradient>
<radialGradient id="s2g" cx="0.5" cy="0.2" r="0.85">
<stop offset="0" stop-color="#14A4B8" stop-opacity="0.26"/><stop offset="1" stop-color="#14A4B8" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1000" height="1500" fill="url(#s2)"/>
<rect width="1000" height="1500" fill="url(#s2g)"/>

<!-- plumb line and the levels an assessor actually checks -->
<line x1="500" y1="200" x2="500" y2="1330" stroke="#14A4B8" stroke-width="2" stroke-dasharray="9 11" opacity="0.55"/>
<line x1="300" y1="560" x2="700" y2="560" stroke="#BDE0E8" stroke-width="2" opacity="0.35"/>
<line x1="300" y1="790" x2="700" y2="790" stroke="#BDE0E8" stroke-width="2" opacity="0.35"/>
<text x="716" y="554" font-family="Inter, Segoe UI, sans-serif" font-size="26" fill="#BDE0E8" opacity="0.6" letter-spacing="3">SHOULDER</text>
<text x="716" y="784" font-family="Inter, Segoe UI, sans-serif" font-size="26" fill="#BDE0E8" opacity="0.6" letter-spacing="3">PELVIS</text>

<!-- the figure, front on -->
<circle cx="500" cy="470" r="46" fill="none" stroke="#BDE0E8" stroke-width="12"/>
<path d="M500 516 L500 800" fill="none" stroke="#BDE0E8" stroke-width="14" stroke-linecap="round"/>
<path d="M430 560 L570 560" fill="none" stroke="#BDE0E8" stroke-width="14" stroke-linecap="round"/>
<path d="M430 560 L392 730 L378 880" fill="none" stroke="#BDE0E8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M570 560 L608 730 L622 880" fill="none" stroke="#BDE0E8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M442 790 L418 1010 L408 1230" fill="none" stroke="#BDE0E8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M558 790 L582 1010 L592 1230" fill="none" stroke="#BDE0E8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="442" y1="790" x2="558" y2="790" stroke="#BDE0E8" stroke-width="14" stroke-linecap="round"/>
<circle cx="430" cy="560" r="13" fill="#0A1416" stroke="#14A4B8" stroke-width="4"/><circle cx="570" cy="560" r="13" fill="#0A1416" stroke="#14A4B8" stroke-width="4"/><circle cx="442" cy="790" r="13" fill="#0A1416" stroke="#14A4B8" stroke-width="4"/><circle cx="558" cy="790" r="13" fill="#0A1416" stroke="#14A4B8" stroke-width="4"/><circle cx="418" cy="1010" r="13" fill="#0A1416" stroke="#14A4B8" stroke-width="4"/><circle cx="582" cy="1010" r="13" fill="#0A1416" stroke="#14A4B8" stroke-width="4"/><circle cx="408" cy="1230" r="13" fill="#0A1416" stroke="#14A4B8" stroke-width="4"/><circle cx="592" cy="1230" r="13" fill="#0A1416" stroke="#14A4B8" stroke-width="4"/>
<line x1="330" y1="1290" x2="670" y2="1290" stroke="#BDE0E8" stroke-width="3" opacity="0.4"/>

<text x="120" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="32" fill="#14A4B8" letter-spacing="6">SCREEN</text>
<text x="120" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="32" fill="#BDE0E8" opacity="0.5" letter-spacing="6">MEASURE</text>
<text x="120" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="32" fill="#BDE0E8" opacity="0.3" letter-spacing="6">REPORT</text>
</svg>